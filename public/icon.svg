<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f75bc" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Background (Android Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow / grid pattern -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />
  
  <!-- Central Math / Physics / Chemistry Emblem -->
  <g filter="url(#shadow)">
    <!-- Shield / Badge -->
    <path d="M 256 90 L 380 140 L 380 270 C 380 345 325 405 256 430 C 187 405 132 345 132 270 L 132 140 Z" fill="#0b1e36" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Letter M and J for MJ JEE -->
    <path d="M 180 300 L 180 200 L 215 250 L 250 200 L 250 300" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 330 200 L 330 280 C 330 305 310 315 285 310" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Atom / Orbit Symbol for Physics/Chemistry -->
    <ellipse cx="256" cy="250" rx="95" ry="34" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.5" transform="rotate(-30 256 250)" />
    <ellipse cx="256" cy="250" rx="95" ry="34" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.5" transform="rotate(30 256 250)" />
    <circle cx="256" cy="250" r="10" fill="#38bdf8" />
  </g>
  
  <!-- JEE Badge -->
  <rect x="186" y="340" width="140" height="34" rx="8" fill="#f59e0b" />
  <text x="256" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">JEE MOCK</text>
</svg>
